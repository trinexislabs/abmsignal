# ABMSignal — production stack (DGX Spark + Cloudflare Tunnel)
#
#   web     : Next.js app server (frontend + API), published on 127.0.0.1:3000 only
#   redis   : BullMQ broker, published on 127.0.0.1:6379 only (so the HOST worker can reach it)
#   migrate : one-shot, runs `prisma migrate deploy` before web starts
#
# NOT in this file (run on the HOST, not in Docker):
#   worker      -> systemd service `abmsignal-worker` (infra/abmsignal-worker.service).
#                  It execs the local OpenClaw CLI + Ollama, so it must run on the host.
#   cloudflared -> systemd service; the ONLY public ingress. Maps:
#                    abmsignal.com      -> http://localhost:3000  (marketing)
#                    app.abmsignal.com  -> http://localhost:3000  (app/dashboard)
#   TLS         -> terminated by Cloudflare. No Caddy / no Let's Encrypt here.
#
# Database: Supabase Postgres (managed). The app connects via the transaction
# pooler (DATABASE_URL, :6543); migrations use a direct connection (DIRECT_URL,
# :5432). No local DB volume — web container and host worker both reach Supabase
# over the network.

x-app-build: &app-build
  context: .
  target: runtime
  args:
    # NEXT_PUBLIC_* are inlined into the client bundle at BUILD time.
    NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
    # Supabase browser client needs these at build time (client bundle):
    NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
    NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    # Loopback-only: reachable by the host worker, never exposed to LAN/internet.
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  migrate:
    build: *app-build
    image: abmsignal:latest
    env_file: .env.production
    command: ["npx", "prisma", "migrate", "deploy"]
    restart: "no"

  web:
    build: *app-build
    image: abmsignal:latest
    env_file: .env.production
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # Loopback-only: cloudflared (on the host) proxies to this. Never public.
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  redisdata:
